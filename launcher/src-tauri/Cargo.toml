[package]
name    = "afkflow-launcher"
version = "1.0.0"
edition = "2021"

[lib]
name             = "afkflow_launcher_lib"
crate-type       = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "afkflow-launcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri              = { version = "2", features = [] }
tauri-plugin-shell        = "2"
tauri-plugin-notification = "2"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
tokio              = { version = "1", features = ["full"] }
thiserror          = "1"
rand               = "0.8"

[profile.release]
opt-level = 3
lto       = true
codegen-units = 1
strip     = true
